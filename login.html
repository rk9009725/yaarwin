<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YaarWin - Log In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #8b949f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Phone container */
        .phone-container {
            width: 480px;
            min-height: 100vh;
            background-color: #f7f9fa;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        /* Header */
        .header {
            background-color: #00db7d;
            color: #ffffff;
            padding: 16px 20px 24px;
            position: relative;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .back-arrow {
            font-size: 24px;
            cursor: pointer;
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            font-style: italic;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .logo span {
            font-weight: 500;
        }

        .logo-star {
            color: #ffffff;
            font-size: 12px;
            vertical-align: super;
            margin-top: -8px;
        }

        .lang-selector {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 14px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .lang-selector img {
            width: 18px;
            height: 12px;
            object-fit: cover;
            border-radius: 2px;
        }

        .header-content h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header-content p {
            font-size: 11.5px;
            line-height: 1.4;
            opacity: 0.95;
            font-weight: 500;
        }

        /* Tabs */
        .tabs-bar {
            display: flex;
            background-color: #ffffff;
            border-bottom: 1px solid #eaeaea;
        }

        .tab-item {
            flex: 1;
            text-align: center;
            padding: 12px 0 10px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            color: #777777;
            border-bottom: 3px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .tab-item.active {
            color: #00db7d;
            border-bottom: 3px solid #00db7d;
        }

        .tab-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab-icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Form Container */
        .form-container {
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            gap: 20px;
        }

        .form-pane {
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .form-pane.active {
            display: flex;
        }

        /* Field Group */
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field-label {
            font-size: 13.5px;
            font-weight: 600;
            color: #333333;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .field-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            color: #00db7d;
        }

        .field-icon svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        /* Inputs wrapper */
        .inputs-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        /* Country code select input box */
        .country-box {
            width: 90px;
            background-color: #ffffff;
            border: 1px solid #eaeaea;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            font-size: 14px;
            font-weight: 500;
            color: #333333;
            position: relative;
            cursor: pointer;
            height: 48px;
        }

        .country-box select {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .country-box .arrow {
            border: solid #888888;
            border-width: 0 2px 2px 0;
            display: inline-block;
            padding: 3px;
            transform: rotate(45deg);
            margin-top: -3px;
        }

        /* Standard Input Field */
        .input-field {
            flex-grow: 1;
            height: 48px;
            background-color: #ffffff;
            border: 1px solid #eaeaea;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 14px;
            color: #333333;
            outline: none;
            font-family: inherit;
        }

        .input-field::placeholder {
            color: #bbbbbb;
        }

        /* Password Input Wrapper */
        .password-wrapper {
            position: relative;
            display: flex;
            width: 100%;
        }

        .password-wrapper .input-field {
            width: 100%;
            padding-right: 44px;
        }

        .eye-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #bbbbbb;
        }

        .eye-toggle svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Checkbox / Remember Password */
        .remember-option {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #777777;
            cursor: pointer;
            user-select: none;
            margin-top: 4px;
        }

        .custom-checkbox {
            width: 16px;
            height: 16px;
            border: 1px solid #cccccc;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            transition: all 0.2s;
        }

        .remember-option input {
            display: none;
        }

        .remember-option input:checked+.custom-checkbox {
            border-color: #00db7d;
            background-color: #00db7d;
        }

        .remember-option input:checked+.custom-checkbox::after {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #ffffff;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            width: 100%;
            height: 48px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-login {
            background-color: #b2c6bd;
            color: #5c6e65;
            border: none;
            letter-spacing: 0.2px;
        }

        .btn-login.active {
            background-color: #00db7d;
            color: #ffffff;
        }

        .btn-register {
            background-color: #ffffff;
            color: #00db7d;
            border: 1px solid #00db7d;
        }

        .btn-register:hover {
            background-color: rgba(0, 219, 125, 0.05);
        }

        /* Bottom Help Links */
        .bottom-help {
            margin-top: auto;
            display: flex;
            justify-content: center;
            gap: 60px;
            padding: 30px 0 20px;
        }

        .help-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #333333;
            font-size: 11.5px;
            font-weight: 500;
        }

        .help-icon-circle {
            width: 48px;
            height: 48px;
            border: 1px solid #00db7d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00db7d;
            background-color: #ffffff;
            transition: all 0.2s;
        }

        .help-item:hover .help-icon-circle {
            background-color: #00db7d;
            color: #ffffff;
        }

        .help-icon-circle svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Responsive shell behavior */
        @media (min-width: 500px) {
            .phone-container {
                overflow: hidden;
            }
        }
    </style>
</head>

<body>

    <div class="phone-container">

        <!-- Header -->
        <header class="header">
            <div class="header-top">
                <a href="index.html" class="back-arrow" aria-label="Back">&#8249;</a>
                <div class="logo">
                    Yaar <span>Win</span> <span class="logo-star">&#10022;</span>
                </div>
                <div class="lang-selector">
                    <img src="https://flagcdn.com/w40/us.png" alt="US Flag" />
                    <span>EN</span>
                </div>
            </div>
            <div class="header-content">
                <h1>Log in</h1>
                <p>Please log in with your phone number or email</p>
                <p>If you forget your password, please contact customer service</p>
            </div>
        </header>

        <!-- Tabs -->
        <nav class="tabs-bar">
            <div class="tab-item active" id="tab-phone" onclick="switchPane('phone')">
                <span class="tab-icon">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M17 1H7c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm-5 20c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm5.25-3H6.75V4h10.5v14z" />
                    </svg>
                </span>
                phone number
            </div>
            <div class="tab-item" id="tab-email" onclick="switchPane('email')">
                <span class="tab-icon">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" />
                    </svg>
                </span>
                Email Login
            </div>
        </nav>

        <!-- Form container -->
        <div class="form-container">

            <!-- Phone form pane -->
            <div class="form-pane active" id="pane-phone">
                <div class="field-group">
                    <label class="field-label">
                        <span class="field-icon">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M17 1H7c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm-5 20c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm5.25-3H6.75V4h10.5v14z" />
                            </svg>
                        </span>
                        Phone number
                    </label>
                    <div class="inputs-row">
                        <div class="country-box">
                            <span id="selected-code">+91</span>
                            <span class="arrow"></span>
                            <select id="country-select" onchange="updateCountryCode(this)" aria-label="Country Code">
                                <option value="+91" selected>India (+91)</option>
                                <option value="+1">United States (+1)</option>
                                <option value="+44">United Kingdom (+44)</option>
                                <option value="+971">United Arab Emirates (+971)</option>
                                <option value="+61">Australia (+61)</option>
                            </select>
                        </div>
                        <input type="tel" id="input-phone" class="input-field"
                            placeholder="Please enter the phone number" oninput="checkInputState()" />
                    </div>
                </div>

                <div class="field-group">
                    <label class="field-label">
                        <span class="field-icon">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" />
                            </svg>
                        </span>
                        Password
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="input-phone-pass" class="input-field" placeholder="Password"
                            oninput="checkInputState()" />
                        <button type="button" class="eye-toggle" onclick="togglePassword('input-phone-pass')"
                            aria-label="Toggle password visibility">
                            <svg id="eye-icon-input-phone-pass" viewBox="0 0 24 24">
                                <path
                                    d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <label class="remember-option">
                    <input type="checkbox" id="check-phone-remember" />
                    <span class="custom-checkbox"></span>
                    Remember password
                </label>

                <div class="btn-group">
                    <button class="btn btn-login" id="btn-login-phone" onclick="submitLogin('phone')">Log in</button>
                    <button class="btn btn-register" onclick="goToRegister()">Register</button>
                </div>
            </div>

            <!-- Email form pane -->
            <div class="form-pane" id="pane-email">
                <div class="field-group">
                    <label class="field-label">
                        <span class="field-icon">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" />
                            </svg>
                        </span>
                        Email address
                    </label>
                    <input type="email" id="input-email" class="input-field" placeholder="Please enter your email"
                        oninput="checkInputState()" />
                </div>

                <div class="field-group">
                    <label class="field-label">
                        <span class="field-icon">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" />
                            </svg>
                        </span>
                        Password
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="input-email-pass" class="input-field" placeholder="Password"
                            oninput="checkInputState()" />
                        <button type="button" class="eye-toggle" onclick="togglePassword('input-email-pass')"
                            aria-label="Toggle password visibility">
                            <svg id="eye-icon-input-email-pass" viewBox="0 0 24 24">
                                <path
                                    d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <label class="remember-option">
                    <input type="checkbox" id="check-email-remember" />
                    <span class="custom-checkbox"></span>
                    Remember password
                </label>

                <div class="btn-group">
                    <button class="btn btn-login" id="btn-login-email" onclick="submitLogin('email')">Log in</button>
                    <button class="btn btn-register" onclick="goToRegister()">Register</button>
                </div>
            </div>

            <!-- Bottom help items -->
            <footer class="bottom-help">
                <a href="#forgot" class="help-item">
                    <div class="help-icon-circle">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM8.9 6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H8.9V6zM18 20H6V10h12v10z" />
                        </svg>
                    </div>
                    Forgot password
                </a>
                <a href="#support" class="help-item">
                    <div class="help-icon-circle">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 12h-2v-2h2v2zm0-4h-2V6h2v4z" />
                        </svg>
                    </div>
                    Customer Service
                </a>
            </footer>

        </div>

    </div>

    <script>
        function switchPane(type) {
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.form-pane').forEach(el => el.classList.remove('active'));

            if (type === 'phone') {
                document.getElementById('tab-phone').classList.add('active');
                document.getElementById('pane-phone').classList.add('active');
            } else {
                document.getElementById('tab-email').classList.add('active');
                document.getElementById('pane-email').classList.add('active');
            }
            checkInputState();
        }

        function updateCountryCode(selectEl) {
            document.getElementById('selected-code').textContent = selectEl.value;
        }

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById('eye-icon-' + inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.82l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.74-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
            }
        }

        function checkInputState() {
            const isPhoneActive = document.getElementById('pane-phone').classList.contains('active');
            if (isPhoneActive) {
                const phoneVal = document.getElementById('input-phone').value.trim();
                const passVal = document.getElementById('input-phone-pass').value.trim();
                const btn = document.getElementById('btn-login-phone');
                if (phoneVal.length > 0 && passVal.length > 0) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            } else {
                const emailVal = document.getElementById('input-email').value.trim();
                const passVal = document.getElementById('input-email-pass').value.trim();
                const btn = document.getElementById('btn-login-email');
                if (emailVal.length > 0 && passVal.length > 0) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            }
        }

        function submitLogin(type) {
            var mobile, password;
            if (type === 'phone') {
                mobile = document.getElementById('input-phone').value.trim();
                password = document.getElementById('input-phone-pass').value;
                if (!mobile || !password) return;
            } else {
                mobile = document.getElementById('input-email').value.trim();
                password = document.getElementById('input-email-pass').value;
                if (!mobile || !password) return;
            }

            const url = `https://script.google.com/macros/s/AKfycby2Zw1Rg82PLPYLUFDy3jHDfhdrVVn1t0wlF1EevvS84rRy4zt692_OOYGVRZeyVQ3coA/exec?mobile=${encodeURIComponent(mobile)}&password=${encodeURIComponent(password)}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    console.log('Response Data:', data);
                    if (data.status === 'success') {
                        window.location.replace('https://19yaarwin.com/#/');
                    } else {
                        // Use data.error if present, fallback to data.message
                        alert('Error: ' + (data.error || data.message || 'Login failed'));
                    }
                })
                .catch((error) => {
                    console.error('Fetch Error:', error);
                    alert('Network error – please try again.');
                });
        }

        // function goToRegister() {
        //     window.location.href = "index.html#register";
        // }
    </script>

</body>

</html>
